spring.application.name=stayhub-Reservation

server.port=8081
grpc.server.port=9091

springdoc.api-docs.path=/api-docs-Reservation
springdoc.swagger-ui.path=/swagger-ui.html

spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/stayhub_reservation}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=${JWT_SECRET:dev-secret-key}

logging.level.org.springframework=INFO
logging.level.com.Angelh0.stayhub=DEBUG
